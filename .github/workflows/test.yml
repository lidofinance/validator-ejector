name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-components:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Set up node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Set up Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build
        run: yarn build
      - name: Typecheck
        run: yarn typecheck
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn test
